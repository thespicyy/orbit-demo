<!DOCTYPE html>
<html lang="fr">
<head>
<script src="../../demo/guard.js"></script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pomodoro · Orbit</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100' fill='none'><circle cx='50' cy='50' r='38' stroke='%23a78bfa' stroke-width='4'/><circle cx='50' cy='50' r='13' fill='%238b5cf6'/><circle cx='69' cy='17.09' r='9' fill='%23f3f1fa'/></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:#07071a;
  font-family:'Inter',system-ui,sans-serif;
  color:#fff;
  overflow-x:hidden;
  font-variant-numeric:tabular-nums;
}

/* ── Décor spatial (repris de hub.html) ── */
.h-orb{position:fixed;border-radius:50%;pointer-events:none;z-index:0;transform:translateZ(0);}
.h-orb-1{width:900px;height:900px;top:-380px;right:-280px;background:radial-gradient(circle,rgba(255,255,255,0.13) 0%,rgba(200,180,255,0.07) 28%,rgba(120,80,255,0.04) 50%,transparent 68%);filter:blur(55px);}
.h-orb-2{width:700px;height:600px;bottom:-250px;left:-200px;background:radial-gradient(ellipse,rgba(109,40,217,0.2) 0%,rgba(80,30,180,0.07) 50%,transparent 72%);filter:blur(80px);}
.h-orb-3{width:480px;height:420px;bottom:-100px;right:10%;background:radial-gradient(ellipse,rgba(6,182,212,0.12) 0%,transparent 68%);filter:blur(70px);}
.h-orb-4{width:600px;height:260px;top:0;left:50%;transform:translateX(-50%) translateZ(0);background:radial-gradient(ellipse at 50% 0%,rgba(80,50,200,0.1) 0%,transparent 70%);filter:blur(60px);}
.h-stars{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(1px 1px at 7% 11%,rgba(255,255,255,0.5) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 18% 68%,rgba(255,255,255,0.3) 0%,transparent 100%),radial-gradient(1px 1px at 28% 6%,rgba(255,255,255,0.4) 0%,transparent 100%),radial-gradient(1px 1px at 39% 53%,rgba(255,255,255,0.25) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 51% 28%,rgba(255,255,255,0.35) 0%,transparent 100%),radial-gradient(1px 1px at 61% 84%,rgba(255,255,255,0.3) 0%,transparent 100%),radial-gradient(1px 1px at 67% 17%,rgba(255,255,255,0.4) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 75% 62%,rgba(255,255,255,0.25) 0%,transparent 100%),radial-gradient(1px 1px at 84% 4%,rgba(255,255,255,0.45) 0%,transparent 100%),radial-gradient(1px 1px at 91% 47%,rgba(255,255,255,0.3) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 95% 85%,rgba(255,255,255,0.35) 0%,transparent 100%),radial-gradient(1px 1px at 13% 38%,rgba(255,255,255,0.2) 0%,transparent 100%),radial-gradient(1px 1px at 44% 91%,rgba(255,255,255,0.28) 0%,transparent 100%),radial-gradient(1px 1px at 56% 9%,rgba(255,255,255,0.38) 0%,transparent 100%);}

/* ── App shell ── */
.app{
  position:relative; z-index:1;
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
}

.topbar{
  width:100%; max-width:640px;
  display:flex; align-items:center; justify-content:space-between;
  padding:22px 20px 0;
}
.brand{display:flex;align-items:center;gap:9px;}
.brand svg{filter:drop-shadow(0 0 10px rgba(139,92,246,0.5));}
.brand-word{
  font-family:'Syne',sans-serif; font-weight:700; font-size:16px;
  background:linear-gradient(120deg,#ffffff,#a78bfa);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}

.icon-btn{
  width:36px; height:36px; border-radius:10px; flex-shrink:0;
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.04);
  color:rgba(255,255,255,0.55);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; transition:all 0.16s ease;
}
.icon-btn:hover{background:rgba(255,255,255,0.09);color:#fff;border-color:rgba(255,255,255,0.22);}
.icon-btn:focus-visible{outline:2px solid rgba(167,139,250,0.9);outline-offset:2px;}

/* ── Pastilles de mode ── */
.mode-pills{display:flex;gap:6px;margin-top:18px;padding:4px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:13px;}
.mode-pill{
  padding:8px 15px; border-radius:9px; border:1px solid transparent;
  background:transparent; color:rgba(255,255,255,0.5);
  font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
  letter-spacing:0.02em; cursor:pointer; transition:all 0.16s ease;
}
.mode-pill:hover{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.85);}
.mode-pill.active{background:rgba(139,92,246,0.18);border-color:rgba(167,139,250,0.35);color:#c4b5fd;}
.mode-pill.active.is-break{background:rgba(6,182,212,0.16);border-color:rgba(34,211,238,0.35);color:#67e8f9;}
.mode-pill:focus-visible{outline:2px solid rgba(167,139,250,0.9);outline-offset:2px;}

/* ── Scène orbitale ── */
.stage-wrap{display:flex;justify-content:center;width:100%;margin:22px 0 8px;}
.stage{
  position:relative;width:min(78vmin,620px);height:min(78vmin,620px);cursor:default;
  opacity:0; transform:scale(0.92);
  transition:opacity 1100ms cubic-bezier(0.16,1,0.3,1), transform 1100ms cubic-bezier(0.16,1,0.3,1);
}
.stage.is-ready{opacity:1;transform:scale(1);}
#orbit-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.readout{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; pointer-events:none;
}
.time{
  font-family:'Space Grotesk',system-ui,sans-serif; font-weight:600;
  font-size:clamp(26px,5.6vmin,44px); line-height:1; letter-spacing:-0.01em;
  color:#ffffff; text-shadow:0 0 22px rgba(139,92,246,0.3);
}
.mode-label{
  font-family:'Inter',sans-serif; font-size:12.5px; font-weight:600;
  color:rgba(255,255,255,0.45); text-transform:uppercase; letter-spacing:0.16em;
}
.session-dots{display:flex;gap:6px;margin-top:6px;}
.session-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);transition:all 0.2s ease;}
.session-dot.filled{background:#a78bfa;border-color:#a78bfa;box-shadow:0 0 7px rgba(167,139,250,0.7);}

/* ── Contrôles ── */
.controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 20px 40px;}

.btn{
  padding:10px 22px; border-radius:10px; border:1px solid transparent;
  font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
  display:inline-flex; align-items:center; gap:6px;
  cursor:pointer; transition:all 0.18s ease; white-space:nowrap;
}
.btn:focus-visible{outline:2px solid rgba(167,139,250,0.9);outline-offset:2px;}
.btn-primary{
  background:linear-gradient(135deg,#8b47f0,#6527d0); color:#fff;
  box-shadow:0 10px 26px rgba(124,58,237,0.38);
  min-width:132px; justify-content:center;
}
.btn-primary:hover{filter:brightness(1.1);}
.btn-ghost{
  background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.7);
  border-color:rgba(255,255,255,0.1);
}
.btn-ghost:hover{background:rgba(255,255,255,0.09);border-color:rgba(255,255,255,0.22);color:#fff;}

/* ── Modale réglages ── */
.modal-overlay{
  position:fixed; inset:0; z-index:50;
  background:rgba(7,7,26,0.88);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  display:none; align-items:center; justify-content:center;
  padding:20px;
}
.modal-overlay.open{display:flex;}
.modal{
  position:relative; width:min(92vw,420px);
  background:rgba(8,7,28,0.96);
  border:1px solid rgba(124,58,237,0.22);
  border-radius:22px;
  box-shadow:0 40px 80px rgba(0,0,0,0.75);
  padding:28px 26px 24px;
  max-height:90vh; overflow-y:auto;
}
.modal::before{
  content:''; position:absolute; top:0; left:10%; right:10%; height:1px;
  background:linear-gradient(90deg,transparent,rgba(139,92,246,0.55) 30%,rgba(6,182,212,0.55) 70%,transparent);
}
.modal h2{font-family:'Space Grotesk',system-ui,sans-serif;font-size:19px;margin-bottom:20px;}
.modal-close{
  position:absolute; top:14px; right:14px; width:30px; height:30px;
  border-radius:8px; border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.6);
  font-size:17px; line-height:1; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all 0.16s ease;
}
.modal-close:hover{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);color:#ef4444;}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;}
.field label{font-size:11px;font-weight:600;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.06em;}
.field input[type="number"]{
  background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
  border-radius:8px; padding:9px 11px; color:#fff;
  font-family:'Inter',sans-serif; font-size:14px; width:100%;
}
.field input[type="number"]:focus{outline:none;border-color:rgba(167,139,250,0.6);}
.field label{display:flex;align-items:center;justify-content:space-between;}
.field-val{font-variant-numeric:tabular-nums;color:#c4b5fd;font-weight:700;letter-spacing:0;text-transform:none;}
.field input[type="range"]{
  -webkit-appearance:none; appearance:none; width:100%; height:4px;
  border-radius:999px; background:rgba(255,255,255,0.12); outline:none;
}
.field input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
  background:#7c3aed; cursor:pointer; border:2px solid rgba(255,255,255,0.9);
  box-shadow:0 2px 8px rgba(0,0,0,0.4);
}
.field input[type="range"]::-moz-range-thumb{
  width:16px; height:16px; border-radius:50%; background:#7c3aed; cursor:pointer;
  border:2px solid rgba(255,255,255,0.9); box-shadow:0 2px 8px rgba(0,0,0,0.4);
}

/* Presets sphère centrale */
.preset-row{display:flex;gap:6px;margin-top:6px;}
.preset-row select,.preset-row input[type="text"]{
  flex:1; min-width:0; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
  border-radius:8px; padding:8px 9px; color:#fff;
  font-family:'Inter',sans-serif; font-size:13px;
}
.preset-row select:focus,.preset-row input[type="text"]:focus{outline:none;border-color:rgba(167,139,250,0.6);}
/* Les options d'un <select> ignorent souvent le fond semi-transparent du
   parent (rendues par le système, pas par ce CSS) : fond opaque explicite
   pour ne pas se retrouver avec du texte blanc sur fond blanc. */
.preset-row select option{background:#14132b;color:#fff;}
.preset-row .btn{padding:8px 12px;font-size:12px;white-space:nowrap;}

.switch-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.switch-row span{font-size:13.5px;color:rgba(255,255,255,0.8);}
.switch-row:last-of-type{border-bottom:none;margin-bottom:6px;}
.switch{position:relative;width:38px;height:22px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:rgba(255,255,255,0.15);border-radius:999px;cursor:pointer;transition:background 0.18s;}
.switch .slider::before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform 0.18s;}
.switch input:checked + .slider{background:#7c3aed;}
.switch input:checked + .slider::before{transform:translateX(16px);}
.switch input:focus-visible + .slider{outline:2px solid rgba(167,139,250,0.9);outline-offset:2px;}

.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

@media (max-width:420px){
  .topbar{padding:18px 16px 0;}
  .controls{gap:8px;}
  .btn{padding:9px 16px;font-size:12.5px;}
  .btn-primary{min-width:112px;}
}
</style>
</head>
<body>

<div class="h-orb h-orb-1"></div>
<div class="h-orb h-orb-2"></div>
<div class="h-orb h-orb-3"></div>
<div class="h-orb h-orb-4"></div>
<div class="h-stars"></div>

<div class="app">

  <header class="topbar">
    <span class="brand">
      <svg viewBox="0 0 100 100" width="26" height="26" fill="none" aria-hidden="true">
        <circle cx="50" cy="50" r="38" stroke="#a78bfa" stroke-width="4"/>
        <circle cx="50" cy="50" r="13" fill="#8b5cf6"/>
        <circle cx="50" cy="12" r="9" fill="#f3f1fa"/>
      </svg>
      <span class="brand-word">Pomodoro</span>
    </span>
    <button class="icon-btn" id="settings-btn" title="Réglages" aria-label="Ouvrir les réglages">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </header>

  <div class="mode-pills">
    <button class="mode-pill active" id="mode-switch-btn" title="Changer de mode" aria-label="Changer de mode de session">Focus</button>
  </div>

  <div class="stage-wrap">
    <div class="stage" id="stage">
      <canvas id="orbit-canvas"></canvas>
      <div class="readout" aria-live="polite">
        <div class="time" id="time-readout">25:00</div>
        <div class="mode-label" id="mode-label">Focus</div>
        <div class="session-dots" id="session-dots"></div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-ghost" id="reset-btn">Réinitialiser</button>
    <button class="btn btn-primary" id="startpause-btn">Démarrer</button>
    <button class="btn btn-ghost" id="skip-btn">Passer</button>
  </div>

</div>

<div class="modal-overlay" id="settings-overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <button class="modal-close" id="settings-close" aria-label="Fermer les réglages">&times;</button>
    <h2 id="settings-title">Réglages</h2>

    <div class="field">
      <label for="set-focus">Focus (minutes)</label>
      <input type="number" id="set-focus" min="1" max="180" step="1">
    </div>
    <div class="field">
      <label for="set-short">Pause courte (minutes)</label>
      <input type="number" id="set-short" min="1" max="60" step="1">
    </div>
    <div class="field">
      <label for="set-long">Pause longue (minutes)</label>
      <input type="number" id="set-long" min="1" max="120" step="1">
    </div>
    <div class="field">
      <label for="set-cycle">Sessions avant pause longue</label>
      <input type="number" id="set-cycle" min="1" max="12" step="1">
    </div>

    <div class="switch-row">
      <span>Son de fin de session</span>
      <label class="switch">
        <input type="checkbox" id="set-sound">
        <span class="slider"></span>
      </label>
    </div>
    <div class="switch-row">
      <span>Enchaîner automatiquement</span>
      <label class="switch">
        <input type="checkbox" id="set-auto">
        <span class="slider"></span>
      </label>
    </div>

    <h2 style="font-size:14px;margin-top:22px;margin-bottom:14px;color:rgba(255,255,255,0.55)">Sphère centrale</h2>

    <div class="field">
      <label for="set-planet-density">Densité (points) <span class="field-val" id="set-planet-density-val"></span></label>
      <input type="range" id="set-planet-density" min="500" max="8000" step="100">
    </div>
    <div class="field">
      <label for="set-planet-spin">Vitesse de rotation <span class="field-val" id="set-planet-spin-val"></span></label>
      <input type="range" id="set-planet-spin" min="0" max="0.02" step="0.001">
    </div>
    <div class="field">
      <label for="set-noise-large">Amplitude du relief (grand) <span class="field-val" id="set-noise-large-val"></span></label>
      <input type="range" id="set-noise-large" min="0" max="0.3" step="0.01">
    </div>
    <div class="field">
      <label for="set-noise-large-freq">Fréquence du relief (grand) <span class="field-val" id="set-noise-large-freq-val"></span></label>
      <input type="range" id="set-noise-large-freq" min="0" max="0.05" step="0.001">
    </div>
    <div class="field">
      <label for="set-noise-detail">Amplitude du relief (détail) <span class="field-val" id="set-noise-detail-val"></span></label>
      <input type="range" id="set-noise-detail" min="0" max="0.5" step="0.01">
    </div>
    <div class="field">
      <label for="set-noise-detail-freq">Fréquence du relief (détail) <span class="field-val" id="set-noise-detail-freq-val"></span></label>
      <input type="range" id="set-noise-detail-freq" min="0" max="5" step="0.1">
    </div>
    <div class="field">
      <label for="set-planet-reactivity">Réactivité au survol <span class="field-val" id="set-planet-reactivity-val"></span></label>
      <input type="range" id="set-planet-reactivity" min="0" max="0.2" step="0.005">
    </div>

    <div class="field">
      <label>Presets de la sphère</label>
      <div class="preset-row">
        <select id="preset-select"><option value="">— Presets enregistrés —</option></select>
        <button type="button" class="btn btn-ghost" id="preset-load-btn">Charger</button>
        <button type="button" class="btn btn-ghost" id="preset-delete-btn">Suppr.</button>
      </div>
      <div class="preset-row">
        <input type="text" id="preset-name-input" placeholder="Nom du nouveau preset" maxlength="40">
        <button type="button" class="btn btn-ghost" id="preset-save-btn">Sauvegarder</button>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" id="settings-cancel">Annuler</button>
      <button class="btn btn-primary" id="settings-save">Enregistrer</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  function logAppError(context, err) {
    console.error('[Pomodoro]', context, err);
  }

  // ── Constantes & état par défaut ─────────────────────────
  var STORAGE_KEY = 'pomodoro_state';

  var MODE_COLORS = {
    focus:      { core:{r:139,g:92,b:246},  ring:{r:167,g:139,b:250}, accent:{r:124,g:58,b:237} },
    shortBreak: { core:{r:6,g:182,b:212},   ring:{r:34,g:211,b:238},  accent:{r:8,g:145,b:178}  },
    longBreak:  { core:{r:34,g:211,b:238},  ring:{r:103,g:232,b:249}, accent:{r:14,g:116,b:144} }
  };
  var MODE_LABELS = { focus:'Focus', shortBreak:'Pause courte', longBreak:'Pause longue' };

  function defaultState() {
    var focusMs = 25 * 60000;
    return {
      version: 1,
      settings: {
        focusMin: 25, shortBreakMin: 5, longBreakMin: 15,
        sessionsBeforeLongBreak: 4, soundOn: true, autoStartNext: false,
        planetDensity: 4500, planetSpinSpeed: 0.004,
        noiseAmpLarge: 0.07, noiseFreqLarge: 0.01,
        noiseAmpDetail: 0.2, noiseFreqDetail: 1.9,
        planetReactivity: 0.06
      },
      session: {
        mode: 'focus', focusCount: 0, running: false,
        endTimestamp: null, remainingMs: focusMs, durationMs: focusMs
      }
    };
  }

  function modeDurationMs(mode, settings) {
    if (mode === 'shortBreak') return settings.shortBreakMin * 60000;
    if (mode === 'longBreak') return settings.longBreakMin * 60000;
    return settings.focusMin * 60000;
  }

  function loadState() {
    var d = defaultState();
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return d;
      var parsed = JSON.parse(raw);

      } else {
        s.running = false;
        s.endTimestamp = null;
        s.remainingMs = dur;

  // carillon. Le launcher sert le statique en Cache-Control: no-store, donc
  // `new Audio(...)` à chaque appel re-télécharge et redécode le fichier à
  // chaque fois — source d'un petit freeze au moment exact où l'intervalle
  // se termine. En le créant une seule fois ici et en le rejouant ensuite
  // (currentTime = 0), le décodage n'a lieu qu'au chargement de la page.
  var chimeAudio = new Audio('sounds/crow.mp3');

  // ── Transition de couleur entre modes ────────────────────
  // `out` optionnel : si fourni, le résultat y est écrit (mutation en place)
  // au lieu d'allouer un nouvel objet — utilisé par planetNoiseColor, appelée
  // pour chaque point de la sphère centrale (jusqu'à des milliers par frame),
  // où une allocation par appel avait fini par saturer le tas JS (cause du
  // freeze périodique : le ramasse-miettes devait souffler toutes les 3-4s).
  function lerpC(a, b, t, out) {
    if (!out) out = {};
    out.r = a.r + (b.r - a.r) * t;
    out.g = a.g + (b.g - a.g) * t;
    out.b = a.b + (b.b - a.b) * t;

  }

  function rgba(c, a) { return 'rgba(' + (c.r | 0) + ',' + (c.g | 0) + ',' + (c.b | 0) + ',' + a + ')'; }

  function hexToRgb(hex) {
    var h = hex.replace('#', '');

  }

  }

  // ── Bruit simplex 3D (portage JS du shader "particle-sphere noise displacement") ──
  // random3 écrit dans `out` (tableau à 3 cases) au lieu d'en allouer un
  // nouveau à chaque appel. snoise3 est appelée 2x par point de la sphère
  // centrale (jusqu'à des milliers par frame), et appelle random3 4x à
  // chaque fois — l'allocation d'un tableau par appel finissait par générer
  // plusieurs millions d'allocations/seconde, saturant le tas JS toutes les
  // 3-4s (cause du freeze périodique observé, confirmé par un relevé mémoire
  // en dents de scie synchronisé avec les micro-freezes).
  function random3(cx, cy, cz, out) {
    var j = 4096.0 * Math.sin(cx * 17.0 + cy * 59.4 + cz * 15.0);
    var rz = j * 512.0 - Math.floor(j * 512.0);
    j *= 0.125;
    var rx = j * 512.0 - Math.floor(j * 512.0);
    j *= 0.125;
    var ry = j * 512.0 - Math.floor(j * 512.0);
    out[0] = rx - 0.5; out[1] = ry - 0.5; out[2] = rz - 0.5;
    return out;
  }
  var _r0 = [0, 0, 0], _r1 = [0, 0, 0], _r2 = [0, 0, 0], _r3 = [0, 0, 0];
  function snoise3(px, py, pz) {
    var F3 = 0.3333333, G3 = 0.1666667;
    var sSum = (px + py + pz) * F3;
    var sx = Math.floor(px + sSum), sy = Math.floor(py + sSum), sz = Math.floor(pz + sSum);
    var gSum = (sx + sy + sz) * G3;
    var xx = px - sx + gSum, xy = py - sy + gSum, xz = pz - sz + gSum;

    var ex = (xx - xy) >= 0 ? 1 : 0;
    var ey = (xy - xz) >= 0 ? 1 : 0;
    var ez = (xz - xx) >= 0 ? 1 : 0;

    var i1x = ex * (1 - ez), i1y = ey * (1 - ex), i1z = ez * (1 - ey);
    var i2x = 1 - ez * (1 - ex), i2y = 1 - ex * (1 - ey), i2z = 1 - ey * (1 - ez);

    var x1x = xx - i1x + G3, x1y = xy - i1y + G3, x1z = xz - i1z + G3;
    var x2x = xx - i2x + 2 * G3, x2y = xy - i2y + 2 * G3, x2z = xz - i2z + 2 * G3;
    var x3x = xx - 1 + 3 * G3, x3y = xy - 1 + 3 * G3, x3z = xz - 1 + 3 * G3;

    var wx = Math.max(0.6 - (xx * xx + xy * xy + xz * xz), 0);
    var wy = Math.max(0.6 - (x1x * x1x + x1y * x1y + x1z * x1z), 0);
    var wz = Math.max(0.6 - (x2x * x2x + x2y * x2y + x2z * x2z), 0);
    var ww = Math.max(0.6 - (x3x * x3x + x3y * x3y + x3z * x3z), 0);

    var r0 = random3(sx, sy, sz, _r0);
    var r1 = random3(sx + i1x, sy + i1y, sz + i1z, _r1);
    var r2 = random3(sx + i2x, sy + i2y, sz + i2z, _r2);
    var r3 = random3(sx + 1, sy + 1, sz + 1, _r3);

    var dx = r0[0] * xx + r0[1] * xy + r0[2] * xz;
    var dy = r1[0] * x1x + r1[1] * x1y + r1[2] * x1z;
    var dz = r2[0] * x2x + r2[1] * x2y + r2[2] * x2z;
    var dw = r3[0] * x3x + r3[1] * x3y + r3[2] * x3z;

    wx *= wx; wx *= wx;
    wy *= wy; wy *= wy;
    wz *= wz; wz *= wz;
    ww *= ww; ww *= ww;

    return (dx * wx + dy * wy + dz * wz + dw * ww) * 52.0;
  }

  // ── Actions utilisateur ───────────────────────────────────
  function updateControlsUI() {
    startPauseBtn.textContent = state.session.running ? 'Pause' : 'Démarrer';
    modeSwitchBtn.textContent = MODE_LABELS[state.session.mode];

  }

  function startPause() {
    var s = state.session;
    if (s.running) {
      s.remainingMs = Math.max(0, s.endTimestamp - Date.now());
      s.running = false;
      s.endTimestamp = null;
    } else {
      ensureAudioCtx();
      if (s.remainingMs <= 0) s.remainingMs = s.durationMs;
      s.endTimestamp = Date.now() + s.remainingMs;
      s.running = true;
    }
    persist();
    updateControlsUI();
  }

  function resetCurrent() {
    var s = state.session;
    s.running = false;
    s.endTimestamp = null;
    s.durationMs = modeDurationMs(s.mode, state.settings);
    s.remainingMs = s.durationMs;
    persist();
    updateControlsUI();
  }

      s.endTimestamp = Date.now() + s.remainingMs;
    } else {
      s.remainingMs = s.durationMs;
      s.running = false;
      s.endTimestamp = null;

  }

    s.durationMs = modeDurationMs(mode, state.settings);
    s.remainingMs = s.durationMs;
    setModeColor(mode, performance.now());
    persist();
    updateControlsUI();
  }

    var idx = MODE_ORDER.indexOf(state.session.mode);
    var next = MODE_ORDER[(idx + 1) % MODE_ORDER.length];

  var SPHERE_N = 650;

    var pts = [];
    var golden = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < SPHERE_N; i++) {

      var r = Math.sqrt(Math.max(0, 1 - y * y));

  // Sert désormais de "soleil" fixe au centre de la scène (l'astre Fibonacci
  // ci-dessus est lui l'objet qui orbite) — cf. drawSun/drawAstre plus bas.
  var PLANET_N = state.settings.planetDensity || 4500;
  function buildPlanetPts() {
    var pts = [];
    var golden = Math.PI * (3 - Math.sqrt(5));
    for (var i = 0; i < PLANET_N; i++) {
      var y = 1 - (i / (PLANET_N - 1)) * 2;

  function renderSessionDots() {
    var cyc = state.settings.sessionsBeforeLongBreak;
    var filled = state.session.mode === 'longBreak' ? cyc : (state.session.focusCount % cyc);
    dotsEl.innerHTML = '';
    for (var i = 0; i < cyc; i++) {
      var d = document.createElement('span');
      d.className = 'session-dot' + (i < filled ? ' filled' : '');
      dotsEl.appendChild(d);
    }
  }
  var lastDotsSignature = '';

  // ── Moteur d'état (avancement de session, son, titre) ──────
  // Tourne via setInterval (pas requestAnimationFrame) car les navigateurs mettent en
  // pause rAF quand l'onglet est en arrière-plan — le minuteur ne passerait alors jamais
  // en pause suivante ni ne jouerait le carillon tant qu'on ne revient pas sur l'onglet.
  // setInterval continue de tourner (au pire ralenti à ~1/s) même en arrière-plan.
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function engineTick() {
    var s = state.session;
    if (s.running) {
      var remaining = s.endTimestamp - Date.now();
      if (remaining <= 0) {
        completeInterval(true);
        s = state.session;
      } else {
        s.remainingMs = remaining;
      }
    }

    var totalSec = Math.max(0, Math.ceil(s.remainingMs / 1000));
    var mm = Math.floor(totalSec / 60), ss = totalSec % 60;
    var timeStr = pad2(mm) + ':' + pad2(ss);
    timeEl.textContent = timeStr;
    modeLabelEl.textContent = MODE_LABELS[s.mode];
    document.title = timeStr + ' · ' + MODE_LABELS[s.mode] + ' — Pomodoro';

    var dotsSig = s.mode + ':' + (s.mode === 'longBreak' ? 'full' : s.focusCount) + ':' + state.settings.sessionsBeforeLongBreak;
    if (dotsSig !== lastDotsSignature) { renderSessionDots(); lastDotsSignature = dotsSig; }
    // Pas de persist() ici : endTimestamp (ce qui compte pour reprendre après
    // un rechargement, cf. resolveOnLoad) est un timestamp absolu déjà
    // sauvegardé une fois pour toutes par startPause()/completeInterval() au
    // moment du démarrage — remainingMs n'est qu'une valeur d'affichage
    // recalculée à chaque tick, jamais relue au chargement pour une session
    // en cours. Réécrire dans localStorage toutes les ~2s ici était donc
    // pur gaspillage — et sur une origine avec beaucoup de données déjà
    // stockées (mois de trades/budget), ce gaspillage devenait un vrai coût :
    // c'était la cause du freeze périodique, pas le rendu canvas.
  }

  setInterval(engineTick, 1000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) engineTick();
  });

  // ── Boucle de rendu visuel (canvas, ~60 fps quand l'onglet est visible) ──
  function tick(now) {
    var s = state.session;
    // Recalculé à chaque frame depuis endTimestamp (comme avant), pas depuis
    // s.remainingMs qui n'est mis à jour qu'1×/s par engineTick — sinon la
    // planète saute d'une position à l'autre au lieu de bouger en continu.
    var displayRemainingMs = s.remainingMs;
    if (s.running && s.endTimestamp) {
      displayRemainingMs = Math.max(0, s.endTimestamp - Date.now());
    }
    var progress = clamp01(1 - displayRemainingMs / s.durationMs);
    var color = currentLerpedColor(now);
    draw(progress, color, now / 1000);
    astreRot += 0.0035;
    requestAnimationFrame(tick);
  }

  updateControlsUI();
  renderSessionDots();
  lastDotsSignature = state.session.mode + ':' + (state.session.mode === 'longBreak' ? 'full' : state.session.focusCount) + ':' + state.settings.sessionsBeforeLongBreak;
  engineTick();
  requestAnimationFrame(tick);

  window.addEventListener('beforeunload', function () { persist(); });
})();
</script>
</body>
</html>
